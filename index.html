<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zorex Donat</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#06050d;--line:rgba(255,255,255,.13);--txt:#f5f3ff;--mut:#a29dcc;--c1:#ffb300;--c2:#ff6a00;--hot:#ff3d7f}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);font-family:Manrope,system-ui,sans-serif;padding-bottom:120px;min-height:100vh;overflow-x:hidden}
.disp{font-family:Unbounded,"Trebuchet MS",sans-serif}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden}
.bg i{position:absolute;border-radius:50%;filter:blur(75px);opacity:.5}
.bg i:nth-child(1){width:300px;height:300px;top:-90px;left:-90px;background:var(--c1);animation:d1 14s ease-in-out infinite alternate}
.bg i:nth-child(2){width:340px;height:340px;top:38%;right:-150px;background:var(--c2);animation:d2 17s ease-in-out infinite alternate}
.bg i:nth-child(3){width:260px;height:260px;bottom:-70px;left:8%;background:#6a3dff;animation:d1 20s ease-in-out infinite alternate-reverse}
.bg::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:38px 38px;-webkit-mask-image:radial-gradient(circle at 50% 30%,#000,transparent 75%);mask-image:radial-gradient(circle at 50% 30%,#000,transparent 75%)}
@keyframes d1{to{transform:translate(90px,130px) scale(1.25)}}
@keyframes d2{to{transform:translate(-100px,-110px) scale(.85)}}
@keyframes fl{50%{transform:translateY(-12px) rotate(8deg)}}
@keyframes sh{to{background-position:200% 0}}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.94)}to{opacity:1;transform:none}}
@keyframes mq{to{transform:translateX(-50%)}}
@keyframes pulse{50%{box-shadow:0 0 0 7px transparent}}
/* loader */
#loader{position:fixed;inset:0;z-index:99;background:radial-gradient(circle at 50% 40%,#1a1448,#07060f 70%);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:12vh;transition:opacity .7s}
#loader.off{opacity:0;pointer-events:none}
#c3d{position:absolute;inset:0;width:100%;height:100%}
.brand{position:relative;font-family:Unbounded,sans-serif;font-size:30px;font-weight:800;letter-spacing:6px;background:linear-gradient(90deg,#7c5cff,#00e0c6,#7c5cff);background-size:200% 100%;animation:sh 2.5s linear infinite;-webkit-background-clip:text;background-clip:text;color:transparent}
.bar{position:relative;width:60%;max-width:260px;height:6px;border-radius:9px;background:#1d1a40;margin-top:16px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7c5cff,#00e0c6);box-shadow:0 0 14px #00e0c6}
.pct{position:relative;margin-top:8px;color:var(--mut);font-size:13px}
/* top */
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 6px}
.logo{font-size:17px;font-weight:800;letter-spacing:2px}
.logo b{background:linear-gradient(90deg,var(--c1),var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent}
.live{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--mut);padding:6px 11px;border-radius:99px;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.live i{width:8px;height:8px;border-radius:50%;background:#2dff9a;box-shadow:0 0 0 0 #2dff9a66;animation:pulse 1.8s infinite}
/* hero */
.hero{margin:10px 16px 0;padding:1.5px;border-radius:28px;background:linear-gradient(110deg,var(--c1),#fff0,var(--c2),#fff0,var(--c1));background-size:300% 100%;animation:sh 6s linear infinite}
.hero>div{position:relative;overflow:hidden;border-radius:27px;padding:22px 18px 18px;background:linear-gradient(160deg,rgba(24,20,56,.92),rgba(8,6,20,.96))}
.hero h2{font-size:25px;line-height:1.2;font-weight:800;max-width:75%}
.hero h2 span{background:linear-gradient(90deg,var(--c1),var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin-top:8px;color:var(--mut);font-size:13px;max-width:70%}
.fx{position:absolute;font-size:40px;filter:drop-shadow(0 8px 14px rgba(0,0,0,.5));animation:fl 4s ease-in-out infinite}
.stats{display:flex;gap:8px;margin-top:16px}
.stats div{flex:1;text-align:center;padding:9px 4px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid var(--line);font-size:11px;color:var(--mut)}
.stats b{display:block;font-family:Unbounded,sans-serif;font-size:15px;color:#fff}
.mq{overflow:hidden;margin:14px 0 4px;border-block:1px solid var(--line);padding:8px 0;background:rgba(255,255,255,.03)}
.mq div{display:flex;gap:34px;width:max-content;animation:mq 22s linear infinite;font-size:12.5px;font-weight:600;color:var(--mut);white-space:nowrap}
/* games */
.games{display:flex;gap:12px;overflow-x:auto;padding:14px 16px 12px;scrollbar-width:none}
.games::-webkit-scrollbar,.subs::-webkit-scrollbar{display:none}
.g{flex:0 0 auto;width:104px;padding:14px 8px 12px;border-radius:22px;text-align:center;font-size:12px;font-weight:700;color:var(--mut);background:rgba(255,255,255,.05);border:1px solid var(--line);transition:.3s}
.g span{display:grid;place-items:center;width:54px;height:54px;margin:0 auto 8px;font-size:28px;border-radius:18px;background:linear-gradient(145deg,var(--a),var(--b));box-shadow:0 8px 20px -6px var(--a);opacity:.65;transition:.3s}
.g.on{color:#fff;transform:translateY(-4px) scale(1.04);border-color:var(--a);background:linear-gradient(170deg,rgba(255,255,255,.14),rgba(255,255,255,.03));box-shadow:0 14px 34px -12px var(--a)}
.g.on span{opacity:1;transform:rotate(-6deg)}
.subs{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 12px}
.s{flex:0 0 auto;padding:9px 16px;border-radius:99px;border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--mut);background:rgba(255,255,255,.04);transition:.25s}
.s.on{color:#150a00;border-color:transparent;background:linear-gradient(90deg,var(--c1),var(--c2));box-shadow:0 8px 22px -8px var(--c2)}
/* cards */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:4px 16px}
.card{position:relative;overflow:hidden;padding:16px 14px 14px;border-radius:22px;border:1px solid var(--line);background:linear-gradient(165deg,rgba(255,255,255,.11),rgba(255,255,255,.02));backdrop-filter:blur(8px);animation:pop .5s both;transition:transform .15s}
.card::before{content:"";position:absolute;width:120px;height:120px;right:-40px;top:-50px;border-radius:50%;background:radial-gradient(circle,var(--c1),transparent 70%);opacity:.45}
.card::after{content:"";position:absolute;top:0;left:-80%;width:60%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.22),transparent);transform:skewX(-20deg);transition:left .6s}
.card:active{transform:scale(.95)}
.card:active::after{left:130%}
.card .n{position:relative;font-size:15px;font-weight:800;min-height:40px;line-height:1.25}
.card .d{position:relative;font-size:11px;color:var(--mut);margin:2px 0 12px}
.card .row{position:relative;display:flex;align-items:center;justify-content:space-between;gap:6px}
.card .p{font-family:Unbounded,sans-serif;font-size:12px;font-weight:800;color:#fff}
.card .go{flex:0 0 auto;width:32px;height:32px;border-radius:11px;display:grid;place-items:center;font-size:17px;font-weight:800;color:#150a00;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 6px 14px -4px var(--c2)}
.tag{position:absolute;z-index:2;top:10px;right:10px;background:linear-gradient(90deg,var(--hot),#ff8a3d);font-size:10px;font-weight:800;padding:3px 8px;border-radius:9px}
/* table */
.tbl{margin:0 16px 14px;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:rgba(255,255,255,.04)}
.tbl h3{padding:12px 14px;font-size:13px;background:linear-gradient(90deg,var(--a),var(--b));color:#10080a}
.tbl div{display:flex;justify-content:space-between;padding:10px 14px;border-top:1px solid var(--line);font-size:13px}
.tbl div b{font-family:Unbounded,sans-serif;font-size:12px}
/* nav */
nav{position:fixed;z-index:20;left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;padding:6px;border-radius:26px;background:rgba(20,16,46,.78);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);box-shadow:0 18px 40px -10px #000}
nav button{flex:1;border:0;background:none;color:var(--mut);font:700 11px Manrope,sans-serif;padding:8px 0;border-radius:20px;transition:.3s}
nav button span{display:block;font-size:20px}
nav button.on{color:#150a00;background:linear-gradient(90deg,var(--c1),var(--c2))}
/* sheet */
#sheet{position:fixed;inset:0;z-index:50;background:rgba(3,2,10,.7);backdrop-filter:blur(4px);display:none;align-items:flex-end}
#sheet.on{display:flex}
.box{width:100%;max-height:92vh;overflow:auto;background:linear-gradient(180deg,#1a1544,#0b0920 40%);border-radius:30px 30px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));border-top:2px solid var(--c1);animation:up .35s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.hd{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.box h2{font-size:17px}
.sel{margin:12px 0 6px;padding:14px;border-radius:18px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(120deg,var(--c1),var(--c2));color:#150a00;font-weight:800}
.sel b{font-family:Unbounded,sans-serif;font-size:14px}
label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin:12px 0 5px}
input,select,textarea{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:#fff;font:600 15px Manrope,sans-serif;outline:none;transition:.2s}
select option{color:#000}
input:focus,select:focus,textarea:focus{border-color:var(--c1);box-shadow:0 0 0 3px rgba(255,255,255,.08)}
.btn{width:100%;margin-top:18px;padding:15px;border:0;border-radius:16px;font:800 16px Manrope,sans-serif;color:#150a00;background:linear-gradient(90deg,var(--c1),var(--c2),var(--c1));background-size:200% 100%;animation:sh 3s linear infinite;box-shadow:0 14px 30px -10px var(--c2)}
.btn.x{background:none;box-shadow:none;animation:none;color:var(--mut);margin-top:4px;font-weight:600}
.info{margin:8px 16px;padding:20px;border-radius:24px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--mut);font-size:14px;line-height:1.8}
.info a{color:var(--c1);font-weight:800}
#toast{position:fixed;z-index:80;left:50%;top:18px;transform:translate(-50%,-90px);padding:12px 18px;border-radius:14px;background:#fff;color:#111;font-weight:800;font-size:13px;transition:.4s}
#toast.on{transform:translate(-50%,0)}
.gwrap{margin:12px 16px 0}
.ghud{display:flex;justify-content:space-between;align-items:center;padding:10px 18px;border-radius:20px;background:rgba(255,255,255,.07);border:1px solid var(--line)}
.ghud small{display:block;font-size:11px;color:var(--mut)}
.ghud b{font-family:Unbounded,sans-serif;font-size:22px}
.tm{font-family:Unbounded,sans-serif;font-size:34px;font-weight:800;color:var(--c1);text-shadow:0 0 20px var(--c2)}
.tm.low{color:#ff3d5a;animation:p2 .45s infinite alternate}
@keyframes p2{to{transform:scale(1.14)}}
.tbar{height:7px;border-radius:9px;background:rgba(255,255,255,.1);margin:10px 0;overflow:hidden}
.tbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--c1),var(--c2))}
.cv{position:relative;border-radius:24px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(180deg,#1a1544,#0d0a26 70%,#2b1a10)}
.cv canvas{display:block;touch-action:none}
.ov{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;background:rgba(6,5,13,.55);backdrop-filter:blur(3px);font-size:14px;color:var(--mut);pointer-events:none}
.ov.act{pointer-events:auto}
.ov h3{color:#fff;font-size:20px;margin-bottom:8px}
.lb{margin:14px 16px;padding:14px;border-radius:22px;border:1px solid var(--line);background:rgba(255,255,255,.05)}
.lb h3{font-size:14px;margin-bottom:8px}
.lb div{display:flex;align-items:center;gap:10px;padding:9px 8px;border-top:1px solid var(--line);font-size:14px;font-weight:700}
.lb i{width:28px;font-style:normal;text-align:center;color:var(--mut)}
.lb span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb b{font-family:Unbounded,sans-serif;font-size:13px;color:var(--c1)}
.lb .me{background:linear-gradient(90deg,rgba(255,255,255,.16),transparent);border-radius:12px}
.mut{color:var(--mut);font-size:13px;font-weight:400}
.fcard{margin:12px 16px 0;padding:24px 18px;border-radius:26px;text-align:center;border:1px solid var(--line);background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.03));color:var(--mut)}
.fcard .big{font-size:56px;font-weight:800;line-height:1.1;background:linear-gradient(90deg,var(--c1),var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bg"><i></i><i></i><i></i></div>
<div id="toast"></div>
<div id="loader">
  <canvas id="c3d"></canvas>
  <div class="brand">ZOREX</div>
  <div class="bar"><i id="fill"></i></div>
  <div class="pct" id="pct">Yuklanmoqda… 0%</div>
</div>
<div class="top"><div class="logo disp">ZOREX<b> DONAT</b></div><div class="live"><i></i>Onlayn</div></div>
<div id="app"></div>
<nav>
  <button class="on" data-t="shop"><span>🎮</span>Do‘kon</button>
  <button data-t="price"><span>📋</span>Narxlar</button>
  <button data-t="game"><span>🏀</span>O‘yin</button>
  <button data-t="fr"><span>👥</span>Do‘stlar</button>
  <button data-t="info"><span>💬</span>Aloqa</button>
</nav>
<div id="sheet"><div class="box" id="box"></div></div>

<script>
/* ============ SOZLAMALAR (shu yerni o'zgartiring) ============ */
const ADMIN_USERNAME = "zorex_admin";   // @ belgisiz
const PAY = ["Uzcard", "Humo", "Click", "Payme"];
const f = n => n.toLocaleString("ru-RU").replace(/\u00a0/g," ") + " so‘m";

/* Narxlar — namunaviy. O'zingizniki bilan almashtiring */
const DATA = {
  pubg:{ico:"🔫",name:"PUBG Mobile",idLabel:"PUBG ID",
    subs:{
      "UC":[["60 UC",13000],["325 UC",65000],["660 UC",130000],["1800 UC",325000],["3850 UC",650000],["8100 UC",1300000]],
      "Buyumlar":[["Royale Pass",150000,"Mavsumiy"],["Elite Pass Plus",330000,"Premium"],["Prime",15000,"Oylik"],["Prime Plus",130000,"Oylik"]],
      "Akkauntlar":[["Boshlang‘ich akkaunt",80000,"Lv 20+"],["O‘rta akkaunt",250000,"Skinlar bilan"],["Premium akkaunt",700000,"Mythic skin"]],
      "Xizmatlar":[["Rank ko‘tarish (Ace)",120000,"Kafolat bilan"],["Rank ko‘tarish (Conqueror)",450000,"Kafolat bilan"],["Kunlik missiyalar",30000,"1 kun"]]
    }},
  ff:{ico:"🔥",name:"Free Fire",idLabel:"Free Fire ID",
    subs:{"Olmos":[["100 💎",14000],["310 💎",42000],["520 💎",68000],["1060 💎",135000],["2180 💎",270000]],
          "Pass":[["Haftalik obuna",22000,"7 kun"],["Oylik obuna",110000,"30 kun"],["Booyah Pass",48000,"Mavsumiy"]]}},
  so2:{ico:"🎯",name:"Standoff 2",idLabel:"Standoff 2 ID",
    subs:{"Gold":[["500 G",13000],["1 000 G",26000],["3 000 G",78000],["10 000 G",250000]]}},
  rb:{ico:"🧱",name:"Roblox",idLabel:"Roblox username",
    subs:{"Robux":[["400 R$",70000],["800 R$",135000],["1700 R$",270000],["4500 R$",650000]]}}
};

/* ============ TELEGRAM ============ */
const tg = window.Telegram && Telegram.WebApp;
if(tg){tg.ready();tg.expand();try{tg.setHeaderColor("#07060f");tg.setBackgroundColor("#07060f")}catch(e){}}

/* ============ 3D LOADER ============ */
(function(){
  const loader=document.getElementById("loader");
  let done=false;
  function finish(){ if(done)return; done=true; loader.classList.add("off"); setTimeout(()=>loader.remove(),800); }
  const p=document.getElementById("pct"), fill=document.getElementById("fill");
  let pr=0; const t0=performance.now(), DUR=3200;
  function prog(){ pr=Math.min(100,Math.floor((performance.now()-t0)/DUR*100));
    fill.style.width=pr+"%"; p.textContent="Yuklanmoqda… "+pr+"%";
    if(pr<100) requestAnimationFrame(prog); else setTimeout(finish,300); }
  prog();
  setTimeout(finish,6000); // xavfsizlik: har holda yopiladi
  try{
    const cv=document.getElementById("c3d");
    const R=new THREE.WebGLRenderer({canvas:cv,alpha:true,antialias:true});
    R.setPixelRatio(Math.min(devicePixelRatio,2));
    const S=new THREE.Scene(), C=new THREE.PerspectiveCamera(55,1,.1,100); C.position.z=7;
    function rs(){R.setSize(innerWidth,innerHeight);C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix()} rs(); addEventListener("resize",rs);
    S.add(new THREE.AmbientLight(0x6655ff,.6));
    const L1=new THREE.PointLight(0x00e0c6,2,30);L1.position.set(5,4,5);S.add(L1);
    const L2=new THREE.PointLight(0x7c5cff,2,30);L2.position.set(-5,-3,4);S.add(L2);
    const knot=new THREE.Mesh(new THREE.TorusKnotGeometry(1.5,.45,160,20),
      new THREE.MeshStandardMaterial({color:0x7c5cff,metalness:.8,roughness:.25,emissive:0x1a1060}));
    knot.position.y=1.2;S.add(knot);
    const wire=new THREE.Mesh(new THREE.TorusKnotGeometry(1.9,.05,200,8),
      new THREE.MeshBasicMaterial({color:0x00e0c6,wireframe:true}));
    wire.position.y=1.2;S.add(wire);
    const cubes=[];
    for(let i=0;i<14;i++){
      const m=new THREE.Mesh(new THREE.BoxGeometry(.3,.3,.3),new THREE.MeshStandardMaterial({color:i%2?0x00e0c6:0xff4d7d,metalness:.6,roughness:.3}));
      m.userData={a:Math.random()*6.28,r:2.8+Math.random()*1.2,s:.4+Math.random()*.6,y:(Math.random()-.5)*3};
      S.add(m);cubes.push(m);
    }
    const pg=new THREE.BufferGeometry(),pa=[];
    for(let i=0;i<500;i++)pa.push((Math.random()-.5)*24,(Math.random()-.5)*24,(Math.random()-.5)*24);
    pg.setAttribute("position",new THREE.Float32BufferAttribute(pa,3));
    const pts=new THREE.Points(pg,new THREE.PointsMaterial({color:0x8f8ab8,size:.04}));S.add(pts);
    (function loop(){
      if(done)return; requestAnimationFrame(loop);
      const t=(performance.now()-t0)/1000;
      knot.rotation.x=t*.7;knot.rotation.y=t*1.1;
      wire.rotation.x=-t*.5;wire.rotation.y=t*.6;
      const sc=1+Math.sin(t*3)*.04;knot.scale.set(sc,sc,sc);
      cubes.forEach(m=>{const u=m.userData;const a=u.a+t*u.s;
        m.position.set(Math.cos(a)*u.r,1.2+u.y+Math.sin(t+u.a)*.3,Math.sin(a)*u.r);
        m.rotation.x+=.03;m.rotation.y+=.04;});
      pts.rotation.y=t*.05;
      R.render(S,C);
    })();
  }catch(e){console.log("3D ishlamadi",e)}
})();

/* ============ ILOVA ============ */
const COL={pubg:["#ffb300","#ff6a00"],ff:["#ff3d00","#ffb300"],so2:["#00e5ff","#2979ff"],rb:["#ff1744","#d500f9"]};
let tab="shop", game="pubg", sub="UC";
const app=document.getElementById("app"), root=document.documentElement;
const hap=(t="light")=>{try{tg&&tg.HapticFeedback.impactOccurred(t)}catch(e){}};
function theme(){const c=COL[game];root.style.setProperty("--c1",c[0]);root.style.setProperty("--c2",c[1])}
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),2600)}
function render(){stopGame();theme(); if(tab==="shop")return shop(); if(tab==="price")return price(); if(tab==="game")return gameView(); if(tab==="fr")return friends(); info();}
function shop(){
  const G=DATA[game];
  if(!G.subs[sub]) sub=Object.keys(G.subs)[0];
  const promo=["⚡ 5 daqiqada yetkazish","🔒 100% xavfsiz to‘lov","💎 Eng arzon narxlar","🎁 Doimiy mijozlarga chegirma","🕒 24/7 qo‘llab-quvvatlash"];
  let h=`<div class="hero"><div>
    <span class="fx" style="right:18px;top:16px">💎</span><span class="fx" style="right:64px;top:70px;font-size:30px;animation-delay:-1.3s">🪙</span><span class="fx" style="right:14px;top:92px;font-size:26px;animation-delay:-2.4s">🎮</span>
    <h2 class="disp">O‘yin donati <span>tez va arzon</span></h2>
    <p>UC, olmos, gold va robux — bir necha bosishda.</p>
    <div class="stats"><div><b>5 daq</b>yetkazish</div><div><b>24/7</b>onlayn</div><div><b>100%</b>kafolat</div></div>
  </div></div>
  <div class="mq"><div>${promo.concat(promo).map(x=>`<span>${x}</span>`).join("")}</div></div>`;
  h+='<div class="games">'+Object.entries(DATA).map(([k,v])=>
    `<div class="g ${k===game?"on":""}" data-g="${k}" style="--a:${COL[k][0]};--b:${COL[k][1]}"><span>${v.ico}</span>${v.name}</div>`).join("")+'</div>';
  h+='<div class="subs">'+Object.keys(G.subs).map(s=>`<div class="s ${s===sub?"on":""}" data-s="${s}">${s}</div>`).join("")+'</div>';
  h+='<div class="grid">'+G.subs[sub].map((it,i)=>
    `<div class="card" data-i="${i}" style="animation-delay:${i*.06}s">${it[2]?`<div class="tag">${it[2]}</div>`:""}
     <div class="n">${it[0]}</div><div class="d">${G.name} · ${sub}</div>
     <div class="row"><div class="p">${f(it[1])}</div><div class="go">+</div></div></div>`).join("")+'</div>';
  app.innerHTML=h;
  app.querySelectorAll("[data-g]").forEach(e=>e.onclick=()=>{game=e.dataset.g;sub=Object.keys(DATA[game].subs)[0];hap();shop();theme()});
  app.querySelectorAll("[data-s]").forEach(e=>e.onclick=()=>{sub=e.dataset.s;hap();shop()});
  app.querySelectorAll("[data-i]").forEach(e=>e.onclick=()=>{hap("medium");order(G.subs[sub][+e.dataset.i])});
  const gs=app.querySelector(".g.on"); if(gs) gs.scrollIntoView({inline:"center",block:"nearest"});
}
function price(){
  let h='<div style="height:12px"></div>';
  for(const [k,g] of Object.entries(DATA)) for(const [s,items] of Object.entries(g.subs))
    h+=`<div class="tbl" style="--a:${COL[k][0]};--b:${COL[k][1]}"><h3 class="disp">${g.ico} ${g.name} · ${s}</h3>${items.map(i=>`<div><span>${i[0]}</span><b>${f(i[1])}</b></div>`).join("")}</div>`;
  app.innerHTML=h;
}
function info(){
  app.innerHTML=`<div style="height:12px"></div><div class="info"><b class="disp" style="color:#fff;font-size:17px">Zorex Donat</b><br>
  PUBG Mobile, Free Fire, Standoff 2 va Roblox uchun donat, akkaunt va xizmatlar.<br>
  ⏱ Buyurtma odatda 5–15 daqiqada bajariladi.<br>
  💳 To‘lov: ${PAY.join(", ")}.<br>
  👤 Admin: <a href="https://t.me/${ADMIN_USERNAME}">@${ADMIN_USERNAME}</a></div>`;
}
function order(it){
  const G=DATA[game], acc=sub==="Akkauntlar";
  document.getElementById("box").innerHTML=`<div class="hd"></div><h2 class="disp">Buyurtma berish</h2>
  <div class="sel"><span>${G.ico} ${it[0]}</span><b>${f(it[1])}</b></div>
  ${acc?"":`<label>${G.idLabel}</label><input id="pid" placeholder="${G.idLabel} kiriting">`}
  <label>O‘yindagi nik (ixtiyoriy)</label><input id="nick" placeholder="Nik">
  <label>To‘lov usuli</label><select id="pay">${PAY.map(p=>`<option>${p}</option>`).join("")}</select>
  <label>Izoh (ixtiyoriy)</label><textarea id="note" rows="2"></textarea>
  <button class="btn" id="ok">Buyurtma berish</button>
  <button class="btn x" id="no">Bekor qilish</button>`;
  sheet(true);
  document.getElementById("no").onclick=()=>sheet(false);
  document.getElementById("ok").onclick=()=>{
    const pid=acc?"-":document.getElementById("pid").value.trim();
    if(!acc && pid.length<3){ hap("heavy"); toast("O‘yin ID ni kiriting"); return; }
    const d={game:G.name,section:sub,item:it[0],price:it[1],pid,
      nick:document.getElementById("nick").value.trim(),
      pay:document.getElementById("pay").value,
      note:document.getElementById("note").value.trim()};
    hap("heavy");
    if(tg){ tg.sendData(JSON.stringify(d)); }
    else { toast("✅ Test: buyurtma yuborildi"); sheet(false); }
  };
}
function sheet(on){ document.getElementById("sheet").classList.toggle("on",on); }
document.getElementById("sheet").onclick=e=>{ if(e.target.id==="sheet") sheet(false); };
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("nav button").forEach(x=>x.classList.remove("on"));
  b.classList.add("on"); tab=b.dataset.t; hap(); render(); scrollTo(0,0);
});
/* ============ DO'STLAR + BASKETBOL ============ */
const BOT_USERNAME="zorex_donat_bot";   // @ belgisiz, o'z botingiz username'i
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const P=(()=>{try{const q=new URLSearchParams(location.search).get("d");if(!q)return{};
  return JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(q.replace(/-/g,"+").replace(/_/g,"/")),c=>c.charCodeAt(0))))}catch(e){return{}}})();
const ME=(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user)||{id:0,first_name:"Siz"};
let best=+(P.b||0); try{best=Math.max(best,+localStorage.getItem("zbest")||0)}catch(e){}
let GM=null;
function stopGame(){if(GM){cancelAnimationFrame(GM.raf);GM=null}try{tg&&tg.enableVerticalSwipes&&tg.enableVerticalSwipes()}catch(e){}}

function friends(){
  const fl=P.f||[], n=P.n!=null?P.n:fl.length;
  const link=`https://t.me/${BOT_USERNAME}?start=ref_${ME.id}`;
  app.innerHTML=`<div class="fcard"><div class="big disp">${n}</div>taklif qilingan do‘st
    <button class="btn" id="inv">👥 Do‘stni taklif qilish</button><button class="btn x" id="cp">🔗 Havolani nusxalash</button></div>
    <div class="lb"><h3 class="disp">Siz taklif qilganlar</h3>${fl.length?fl.map((r,i)=>`<div><i>${i+1}</i><span>${esc(r[0])}</span><b style="font-size:11px;color:var(--mut)">${esc(r[1]||"")}</b></div>`).join(""):'<p class="mut">Hali hech kim yo‘q. Havolani do‘stlaringizga yuboring!</p>'}</div>`;
  document.getElementById("inv").onclick=()=>{hap("medium");const u="https://t.me/share/url?url="+encodeURIComponent(link)+"&text="+encodeURIComponent("Zorex Donat — o‘yin donati tez va arzon! 🎮");
    tg&&tg.openTelegramLink?tg.openTelegramLink(u):window.open(u)};
  document.getElementById("cp").onclick=()=>{try{navigator.clipboard.writeText(link);toast("Havola nusxalandi ✅")}catch(e){toast(link)}};
}
function board(){
  const real=P.t&&P.t.length;
  let t=real?P.t.slice():[["Sardor",31,1],["Jasur",27,2],["Malika",24,3],["Bekzod",22,4],["Dilnoza",19,5],["Aziz",17,6],["Nodira",15,7],["Sherzod",12,8],["Lola",10,9],["Otabek",8,10]];
  if(!real){t=t.filter(r=>r[2]!==ME.id);if(best>0)t.push([ME.first_name||"Siz",best,ME.id])}
  t.sort((a,b)=>b[1]-a[1]);t=t.slice(0,10);
  return `<div class="lb"><h3 class="disp">🏆 Top 10 o‘yinchi</h3>`+t.map((r,i)=>`<div class="${r[2]===ME.id&&ME.id?"me":""}"><i>${["🥇","🥈","🥉"][i]||i+1}</i><span>${esc(r[0])}</span><b>${r[1]}</b></div>`).join("")+(real?"":'<p class="mut">Namuna reyting. Natijangizni yuborsangiz, haqiqiy reytingga qo‘shilasiz.</p>')+`</div>`;
}
function gameView(){
  app.innerHTML=`<div class="gwrap"><div class="ghud"><div><small>Hisob</small><b id="sc">0</b></div><div class="tm" id="tm">12.0</div><div style="text-align:right"><small>Rekord</small><b id="bs">${best}</b></div></div>
    <div class="tbar"><i id="tb"></i></div><div class="cv"><canvas id="gc"></canvas><div class="ov" id="ov"></div></div></div>`+board();
  const $=id=>document.getElementById(id),cv=$("gc"),x=cv.getContext("2d"),dpr=Math.min(devicePixelRatio||1,2);
  const W=cv.parentNode.clientWidth,H=Math.max(300,Math.round(innerHeight*.5)),R=15,RW=34,T0=12;
  cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+"px";cv.style.height=H+"px";x.scale(dpr,dpr);
  const s={x:W/2,y:H-R,vx:0,vy:0,a:0,hx:W-70,hy:H*.4,sc:0,t:T0,on:false,over:false,pops:[],sq:0,last:performance.now()};
  try{tg&&tg.disableVerticalSwipes&&tg.disableVerticalSwipes()}catch(e){}
  function moveHoop(){let k=0;do{s.hx=RW+30+Math.random()*(W-2*RW-60);s.hy=90+Math.random()*(H-230)}while(Math.hypot(s.hx-s.x,s.hy-s.y)<120&&k++<20)}
  function hud(){$("sc").textContent=s.sc;$("tm").textContent=s.t.toFixed(1);$("tm").classList.toggle("low",s.on&&s.t<4);$("tb").style.width=s.t/T0*100+"%"}
  function reset(){Object.assign(s,{x:W/2,y:H-R,vx:0,vy:0,sc:0,t:T0,on:false,over:false,pops:[],last:performance.now()});moveHoop();
    const o=$("ov");o.className="ov";o.style.display="grid";o.innerHTML='<div><h3 class="disp">🏀 Tayyor?</h3><p>Ekranga bosing — koptok sakraydi.<br>Savatga tushiring: har gol vaqtni 12 soniyaga qaytaradi.</p></div>';hud()}
  function end(){s.over=true;if(s.sc>best){best=s.sc;try{localStorage.setItem("zbest",best)}catch(e){}$("bs").textContent=best}
    const o=$("ov");o.className="ov act";o.style.display="grid";
    o.innerHTML=`<div><h3 class="disp">⏱ Vaqt tugadi!</h3><p>Hisob: <b style="color:#fff;font-size:20px">${s.sc}</b></p><button class="btn" id="re">Qayta o‘ynash</button>${tg&&s.sc>0?'<button class="btn x" id="sd">📤 Reytingga yuborish</button><p style="font-size:11px">Yuborilgach ilova yopiladi</p>':""}</div>`;
    $("re").onclick=reset;const sd=$("sd");if(sd)sd.onclick=()=>tg.sendData(JSON.stringify({type:"score",score:s.sc}))}
  cv.addEventListener("pointerdown",e=>{if(s.over)return;
    if(!s.on){s.on=true;$("ov").style.display="none";s.last=performance.now()}
    const r=cv.getBoundingClientRect();s.vy=-640;s.vx=Math.max(-380,Math.min(380,s.vx*.3+(e.clientX-r.left-s.x)*3));hap()});
  function step(now){
    const dt=Math.min(.033,(now-s.last)/1000);s.last=now;
    if(s.on&&!s.over){
      const py=s.y;s.vy+=1500*dt;s.x+=s.vx*dt;s.y+=s.vy*dt;s.a+=s.vx*dt/R;
      if(s.x<R){s.x=R;s.vx=Math.abs(s.vx)*.75}
      if(s.x>W-R){s.x=W-R;s.vx=-Math.abs(s.vx)*.75}
      if(s.y<R){s.y=R;s.vy=Math.abs(s.vy)*.6}
      if(s.y>H-R){s.y=H-R;s.vy=Math.abs(s.vy)>130?-s.vy*.68:0;s.vx*=.98}
      for(const ex of[s.hx-RW,s.hx+RW]){const dx=s.x-ex,dy=s.y-s.hy,d=Math.hypot(dx,dy),m=R+4;
        if(d<m&&d>0){const nx=dx/d,ny=dy/d;s.x=ex+nx*m;s.y=s.hy+ny*m;const vn=s.vx*nx+s.vy*ny;if(vn<0){s.vx-=1.6*vn*nx;s.vy-=1.6*vn*ny}}}
      if(s.vy>0&&py<s.hy&&s.y>=s.hy&&Math.abs(s.x-s.hx)<RW-4){
        s.sc++;s.t=T0;s.sq=1;s.pops.push({x:s.hx,y:s.hy,t:0});
        try{tg&&tg.HapticFeedback.notificationOccurred("success")}catch(e){}
        moveHoop()}
      s.t-=dt;if(s.t<=0){s.t=0;hap("heavy");end()}
      hud()}
    draw()}
  function draw(){
    x.clearRect(0,0,W,H);x.fillStyle="#4a2d16";x.fillRect(0,H-5,W,5);
    const side=s.hx<W/2?-1:1,bx=s.hx+side*(RW+9);
    x.fillStyle="rgba(255,255,255,.92)";x.fillRect(bx-3,s.hy-48,6,60);
    s.sq=Math.max(0,s.sq-.03);const nh=34+s.sq*10;
    x.strokeStyle="rgba(255,255,255,.75)";x.lineWidth=1.5;x.beginPath();
    for(let i=0;i<=6;i++){x.moveTo(s.hx-RW+i*RW/3,s.hy);x.lineTo(s.hx-RW*.6+i*RW*.2,s.hy+nh)}
    for(let j=1;j<3;j++){const yy=s.hy+nh*j/3,k=1-.4*j/3;x.moveTo(s.hx-RW*k,yy);x.lineTo(s.hx+RW*k,yy)}
    x.stroke();
    x.strokeStyle="#ff5a2a";x.lineWidth=5;x.lineCap="round";x.beginPath();x.moveTo(s.hx-RW,s.hy);x.lineTo(s.hx+RW,s.hy);x.stroke();
    x.save();x.translate(s.x,s.y);x.rotate(s.a);
    const g=x.createRadialGradient(-5,-5,2,0,0,R);g.addColorStop(0,"#ffa24d");g.addColorStop(1,"#d9480f");
    x.fillStyle=g;x.beginPath();x.arc(0,0,R,0,7);x.fill();x.clip();
    x.strokeStyle="#2a1204";x.lineWidth=1.6;x.beginPath();x.moveTo(-R,0);x.lineTo(R,0);x.moveTo(0,-R);x.lineTo(0,R);x.stroke();
    x.beginPath();x.arc(-R*1.25,0,R,-.9,.9);x.stroke();x.beginPath();x.arc(R*1.25,0,R,Math.PI-.9,Math.PI+.9);x.stroke();x.restore();
    s.pops=s.pops.filter(p=>(p.t+=.03)<1);
    s.pops.forEach(p=>{x.globalAlpha=1-p.t;x.fillStyle="#fff";x.font="800 22px Unbounded,sans-serif";x.textAlign="center";x.fillText("+1",p.x,p.y-20-p.t*40)});x.globalAlpha=1}
  GM={raf:0};reset();
  (function lp(n){if(!GM)return;step(n);GM.raf=requestAnimationFrame(lp)})(performance.now());
}
render();
</script>
